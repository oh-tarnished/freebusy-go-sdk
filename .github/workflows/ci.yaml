name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::unformatted files"
            echo "$unformatted"
            exit 1
          fi
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  vuln:
    name: Vulnerabilities (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  osv:
    name: Dependencies (OSV-Scanner)
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.0
    with:
      scan-args: --recursive ./
      # Fails the job on a known vulnerability. The SARIF stays a run
      # artifact: uploading it to code scanning needs GitHub Advanced
      # Security, which a private repository may not have.
      upload-sarif: false

  sandbox:
    name: Examples against the API server (sandbox)
    runs-on: ubuntu-latest
    # The server is the release sandbox/compose.yaml pins; Dependabot opens
    # a pull request for each new one, and this job tests it.
    env:
      FREEBUSY_CALDAV_URL: "http://127.0.0.1:8080/dav"
      FREEBUSY_ENDPOINT: "127.0.0.1:50051"
      FREEBUSY_INSECURE: "true"
      FREEBUSY_REST_ENDPOINT: "http://127.0.0.1:8080"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Start the sandbox
        run: docker compose -f sandbox/compose.yaml up -d
      - name: Wait until it is ready
        run: |
          for _ in $(seq 90); do
            curl -fsS "http://127.0.0.1:8080/health" >/dev/null && exit 0
            sleep 2
          done
          echo "::error::the sandbox never answered http://127.0.0.1:8080/health"
          exit 1
      - name: Run the examples
        run: |
          for d in examples/*/; do
            [ -d "$d" ] || continue
            echo "== $d"
            go run "./$d"
          done
      - name: Sandbox logs
        if: failure()
        run: docker compose -f sandbox/compose.yaml logs --no-color
      - name: Tested against
        if: always()
        run: |
          {
            echo "### Sandbox"
            docker compose -f sandbox/compose.yaml config --images | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

