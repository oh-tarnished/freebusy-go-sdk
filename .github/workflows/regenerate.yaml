name: Regenerate

# Reruns protoc-gen-sdk over the API and opens a pull request with the
# result. Triggered by the API's release (repository_dispatch, type
# api-release, with client_payload {"module": "buf.build/org/name", "commit":
# "<commit or label>"} to move that module's pins), weekly (picking up a new
# protoc-gen-sdk or GAPIC), and by hand.

on:
  repository_dispatch:
    types: [api-release]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    name: Regenerate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: Install the generators
        run: |
          go install github.com/googleapis/gapic-generator-go/cmd/protoc-gen-go_gapic@v0.65.0
          go install github.com/the-protobuf-project/sdk/plugin/cmd/protoc-gen-sdk@latest
      - name: Move the released module's pin
        if: github.event_name == 'repository_dispatch' && github.event.client_payload.module != ''
        working-directory: api
        env:
          MODULE: ${{ github.event.client_payload.module }}
          COMMIT: ${{ github.event.client_payload.commit }}
        run: |
          [[ "$MODULE" =~ ^buf\.build/[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] || { echo "::error::bad module $MODULE"; exit 1; }
          [[ "$COMMIT" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::bad commit $COMMIT"; exit 1; }
          # Every pin of the module, in sdk.yaml (input and references) and
          # buf.gen.yaml, moves to the released commit.
          sed -i -E "s#(${MODULE//./\\.})(:[A-Za-z0-9._-]+)?#\1:${COMMIT}#g" sdk.yaml buf.gen.yaml
      - name: Generate, build and test
        run: ./scripts/generate.sh
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: regenerate/api
          commit-message: 'chore: regenerate from the API'
          title: 'chore: regenerate from the API'
          body: |
            Regenerated by protoc-gen-sdk from the API pinned in `api/buf.yaml`
            (trigger: `${{ github.event_name }}`). Review the diff, add a
            CHANGELOG.md section, merge, and tag the release.
