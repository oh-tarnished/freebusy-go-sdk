name: Release

# On a version tag: test, publish the tag's CHANGELOG.md section as the
# GitHub release with an SPDX SBOM of the module and a source archive, both
# with SLSA build provenance (GitHub artifact attestations, Sigstore), and
# have the Go module proxy and pkg.go.dev fetch the version (a Go module is
# published by its tag; the fetch makes it visible at once).

on:
  push:
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write      # Sigstore, for the attestations
  attestations: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go build ./... && go vet ./... && go test ./...
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no '## [$version]' section"
            exit 1
          fi
      - name: Source archive, as the module proxy serves it
        run: git archive --format=zip --prefix="freebusy-go-${GITHUB_REF_NAME}/" -o "source-${GITHUB_REF_NAME}.zip" "$GITHUB_REF_NAME"
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - name: SLSA build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: source-*.zip
      - name: SBOM attestation
        uses: actions/attest-sbom@v2
        with:
          subject-path: source-*.zip
          sbom-path: sbom.spdx.json
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md $prerelease \
            "source-${GITHUB_REF_NAME}.zip" sbom.spdx.json
      - name: Publish to the Go module proxy and pkg.go.dev
        run: |
          curl -fsS "https://proxy.golang.org/github.com/shokki-engineering/freebusy-go/@v/${GITHUB_REF_NAME}.info"
          curl -fsS -X POST "https://pkg.go.dev/fetch/github.com/shokki-engineering/freebusy-go@${GITHUB_REF_NAME}" || true
